BASE_TASK_CONFIG_PATH: habitat_extensions/config/vlnce_task.yaml
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]
TRAINER_NAME: schedulesampler-OPENNAV  
GPU_NUMBERS: 1
NUM_ENVIRONMENTS: 1
CHECKPOINT_FOLDER: logs/checkpoints/
EVAL_CKPT_PATH_DIR: logs/checkpoints/
RESULTS_DIR: logs/eval_results/

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  EPISODE_COUNT: 100

MODEL:
  policy_name: PolicyViewSelectionCMA
  spatial_output: False
  RGB_ENCODER:
    encode_size: 2048
    output_size: 512
  DEPTH_ENCODER:
    encode_size: 128
    output_size: 256
    ddppo_checkpoint: data/pretrained_models/ddppo-models/gibson-2plus-resnet50.pth
  VISUAL_DIM:
    vis_hidden: 512
    directional: 64
  INSTRUCTION_ENCODER:
    bidirectional: True
    use_pretrained_embeddings: False
    embedding_size: 256
    hidden_size: 256

# -----------------------------------------------------------------------------
# Open-Nav Harness / multimodal visual evidence and U-series switches
# -----------------------------------------------------------------------------
# Default here enables V2 plus conservative U-series decision-effect:
#   - V1 extracts visual evidence from candidate images.
#   - V2 verifies STOP proposals with visual evidence and can reject unsupported
#     STOP when VISUAL_TARGET_VERIFIER.LOG_ONLY is false.
#   - V3 aggregates visual evidence into episode memory.
#   - V4 builds multimodal selector context for U1/logging but stays log-only.
#   - U1 can affect route/subgoal selector context.
#   - U2 allows only verify-phase current-view visual STOP rescue and blocks
#     unsafe rescue cases.
#   - U3 only reselects when the current fallback candidate is invalid/blocked.
#
# Note: run_OpenNav.bash does not override OPENNAV_HARNESS by default, so this
# yaml is the single source of truth for harness switches. Extra command-line
# overrides passed after the script command still take precedence.
OPENNAV_HARNESS:
  ENABLED: True
  ENABLE_HARNESS_LOGGING: True
  ENABLE_DECISION_EFFECT: True
  TRACE_DIR: logs/harness_traces/clean_baseline_v1
  TRACE_FORMAT: jsonl
  LOG_IMAGES: False
  FAIL_OPEN: True

  # P0 ablation switch: inject WaypointBert sensor distance into navigator
  # observations ([Waypoint distance: X m]). Set False for the clean baseline
  # (tuned-9B without P0) to isolate P0's effect. See docs/architecture_optimization_20260701.md.
  # Run1 (baseline): False | Run2 (P0): True
  # P1 collection: MUST be False — calibration distribution must bind to P1's
  # actual deployment config (geometry off); do not leak P0 contamination into
  # the calibration data. (McNemar 20260702: P0 no significant benefit, p=0.21.)
  GEOMETRY_INJECTION: False

  # V1: send candidate RGB views to local Qwen-VL service and log structured
  # visual evidence. Required by V3 and V4.
  VISUAL_EVIDENCE:
    ENABLED: True
    LOG_ONLY: True
    BASE_URL: http://127.0.0.1:23333/v1
    # MODEL: /root/models/Qwen3.5-4B  # 4B (RTX 3090 / ~12GB VRAM)
    MODEL: /root/models/Qwen3.5-9B    # 9B (RTX 4090 / ~24GB VRAM)
    MAX_CANDIDATES: 5
    MAX_IMAGE_EDGE: 384
    MAX_TOKENS: 768
    TIMEOUT_SECONDS: 60.0
    IMAGE_JPEG_QUALITY: 70
    METADATA_OBSERVATION_CHARS: 300
    COMPACT_JSON: True

  # V2: decision-effect active — gates STOP based on visual verification.
  VISUAL_TARGET_VERIFIER:
    ENABLED: True
    LOG_ONLY: false
    CONFIDENCE_THRESHOLD: 0.9
    REQUIRE_ARRIVAL_EVIDENCE: True
    REJECT_ON_MISSING_FINAL_LANDMARKS: True
    REJECT_ON_UNCERTAIN: True
    MIN_STEPS_BEFORE_ALLOW: 3
    REQUIRE_FULL_COVERAGE_FOR_ALLOW: True
    BLOCK_GENERIC_FINAL_TERMS_FOR_ALLOW: True
    REQUIRE_COMPLETION_FOR_SELECTOR_STOP: True
    REQUIRE_CURRENT_VIEW_TEXT_CORROBORATION_FOR_ALLOW: False

    # v2 DEPTH STOP VETO (default OFF -> clean baseline byte-identical). When ENABLED,
    # a STOP-enabling gate (#2 arrival_override / #4 trajectory_bypass / #5 PSG commit)
    # additionally requires the metric depth of the claimed target direction (center
    # region of the current forward view) to be within MAX_TARGET_DIST_M. Uses the RGB-D
    # depth sensor (legal for all VLN-CE methods; zero oracle exposure). Fail-open when
    # depth is unavailable. HONEST SCOPE: measures center-of-view distance, not the
    # target's distance -- vetoes the "staring at a distant opening = arrival" lie
    # (ep377 @ 5.42 m), not every confident lie. Raw depth logged (event depth_stop_veto)
    # so the A/B run can measure hit / false-veto rate. Run separately from BACKTRACK.
    DEPTH_STOP_VETO:
      ENABLED: True
      MAX_TARGET_DIST_M: 3.0    # == TASK.SUCCESS_DISTANCE
      CENTER_FRAC: 0.25

  # V3: aggregate V1 visual evidence across the current episode.
  VISUAL_EVIDENCE_MEMORY:
    ENABLED: True
    LOG_ONLY: true
    MAX_HISTORY: 64
    MAX_NOTES_CHARS: 240

  # V4: log-only — U1 decision-effect requires V4 to stay log-only (harness constraint).
  # V4 output still feeds into U1 phase-aware context as input.
  MULTIMODAL_SELECTOR_CONTEXT:
    ENABLED: True
    LOG_ONLY: true
    MAX_SUMMARY_CHARS: 180
    INCLUDE_MEMORY_SUFFIX: False
    DECISION_MODE: phase_gated_u1
    APPLY_PHASES: [search, approach, verify]
    SUPPRESS_TARGET_ARRIVAL_FOR_SELECTOR: true
    MIN_CONFIDENCE_FOR_TARGET_HINT: 0.9

  # Low-risk runtime reduction: cap verbose text LLM outputs while keeping the
  # same decision flow and candidate set. Set a value <=0 to disable a cap.
  # NOTE: token caps are model-dependent. 9B produces longer CoT and gets
  # truncated before emitting "Prediction: X" at the 4B-tuned caps (empty-pred
  # fallback 22.4% vs 4B 6.9%). See model_switch_guide.md "LLM_RUNTIME 参数".
  LLM_RUNTIME:
    # 4B:  COMPLETION_MAX_TOKENS: 512
    COMPLETION_MAX_TOKENS: 768   # 9B
    # 4B:  NAVIGATOR_MAX_TOKENS: 1024
    NAVIGATOR_MAX_TOKENS: 2048    # 9B (fixes 22.4% empty-pred fallback from truncation)
    THOUGHT_FUSION_MAX_TOKENS: 256
    DECISION_MAX_TOKENS: 64

  # The previous 8/10 hard limit cut off many near-goal episodes. Keep the
  # evaluation bounded, but leave enough room for recovery after a wrong turn.
  NAVIGATION_RUNTIME:
    SHORT_ACTION_STEP_LIMIT: 10
    LONG_ACTION_STEP_LIMIT: 12
    SHORT_ACTION_COUNT_THRESHOLD: 6
    BLOCK_WEAK_FINAL_TARGET_COMPLETION_STOP: True
    MIN_STEPS_FOR_WEAK_FINAL_TARGET_COMPLETION_STOP: 8

  # M1: arrival_gate log-only. Fires when goal dist <= threshold and phase is ok.
  # Set ENABLED: False to disable without removing config.
  ARRIVAL_GATE:
    ENABLED: True
    DIST_THRESHOLD: 4.0
    ALLOWED_PHASES:
      - approach
      - verify
      - recover
      - unknown
    MIN_TRIGGER_STEP: 1

  # M3: proactive stop gate. When dist < threshold and final_target_visible=True
  # and arrival_evidence=True, re-run V2 with stop_flag=True to force a real verdict.
  # Only fires if navigator did NOT propose stop. Set ENABLED: False to disable.
  # E3-for-M3: COMMIT_DIST_THRESHOLD adds an inner zone — V2 re-evaluation always
  # fires when dist < DIST_THRESHOLD, but STOP is committed only when dist <
  # COMMIT_DIST_THRESHOLD. Prevents premature stops in the [commit, outer] band.
  # Set COMMIT_DIST_THRESHOLD: 0 to restore original behavior (commit anywhere).
  PROACTIVE_STOP_GATE:
    ENABLED: True
    DIST_THRESHOLD: 3.5
    COMMIT_DIST_THRESHOLD: 2.0

  # Backtracking (hunk 4, default OFF -> clean baseline byte-identical). When ENABLED,
  # MOVE_BACK is offered to the navigator only on an observable ego displacement stall
  # OR a waypoint dead-end (len(radius_dict)==0); selecting it retraces the last move
  # (turn 180, same distance). Oracle-free: triggers read only the agent's own odometry
  # / candidate exhaustion, never goal distance. Anti-oscillation: budget-capped, never
  # two in a row, last_executed_move cleared after a backtrack. Run separately from
  # DEPTH_STOP_VETO (do not flip both at once -- attribution).
  # Endgame tilt view (added 20260718; ships OFF in config/default.py, ON here).
  # The 12-camera rig is yaw-only (pitch hardcoded 0.0 in get_camera_orientations),
  # so floor closer than ~1.25m is outside every frame -- a geometric cause of the
  # 46% near-distance under-detection. When ENABLED, one -30 deg RGB+depth pair is
  # added and observed ONLY at endgame stop gates (armed by final clause / final
  # landmark seen / step budget; never by phase, which is oracle-contaminated).
  # Keep LOG_ONLY: True for the first run -- measure how many near-field targets the
  # eye-level rig misses BEFORE letting it move any decision.
  # Held at "llm" so this run is a single-variable test of CANDIDATE_PRIOR below.
  # The "rule" mode (zero-cost progress estimate, saves ~3h/run) is a cost lever,
  # not an SR lever -- it is queued for the run after this one.
  COMPLETION_ESTIMATION:
    MODE: llm

  # Decision-active. MIN_PROB_GAP 0.00 = defer to the prior on every disagreement
  # (~59% intervention). Out-of-fold scan (GroupKFold-5 by episode, 5 seeds):
  #   0.00 43.8+-.6 | 0.05 44.2+-.8 | 0.10 42.5+-.4 | 0.20 39.2+-.6 | LLM alone 36.7
  # 0.00 and 0.05 tie within noise, both beat the old 0.10 default by more than the
  # seed spread. See default.py for the two caveats that ride along.
  CANDIDATE_PRIOR:
    ENABLED: True
    LOG_ONLY: False
    MIN_PROB_GAP: 0.00

  ENDGAME_TILT_VIEW:
    ENABLED: True
    LOG_ONLY: True
    PITCH_DEG: -30.0
    ARM_ON_FINAL_CLAUSE: False
    ARM_ON_FINAL_LANDMARK: True
    ARM_STEP_FRAC: 0.7
    MAX_PER_EPISODE: 4
    MIN_STEP_GAP: 3
    ALWAYS_ON_STOP: True
    DEDUPE_DIST_M: 0.5
    DEDUPE_HEADING_DEG: 15.0
    CENTER_FRAC: 0.25

  BACKTRACK:
    ENABLED: True
    MAX_BACKTRACKS_PER_EPISODE: 2
    STALL_WINDOW: 3
    DISP_EPS: 1.0
    DISP_RATIO: 0.35

  # Max config: all U-series units active with decision effect.
  # DECISION_EFFECT_UNIT=combined activates U1+U2+U3 simultaneously.
  U_SERIES:
    ENABLED: True
    DECISION_EFFECT_UNIT: combined

    # U1: phase-aware evidence scaffolding — injects phase-gated context into selector.
    PHASE_EVIDENCE:
      ENABLED: True
      LOG_ONLY: false
      UNKNOWN_CONFIDENCE_THRESHOLD: 0.4
      LATE_STEP_THRESHOLD: 4

    # U2: evidence-grounded STOP verifier — can rescue a blocked STOP when
    # visual evidence is strong enough (complements V2 gating).
    STOP_EVIDENCE_VERIFIER:
      ENABLED: True
      LOG_ONLY: false
      ENABLE_RESCUE: true
      ENABLE_RELATION_CHECK: true
      ENABLE_WEAK_TARGET_ADJUSTMENT: true
      RESCUE_CONFIDENCE_THRESHOLD: 0.95
      RESCUE_MIN_STEP: 3
      # ORACLE REMOVED (20260704): these two gates make the E5 rescue decision branch
      # on recent_distance_gains (= simulator geodesic goal distance delta = GT leakage).
      # Audit found them 0-decisive (594 firings, always co-occur with a non-oracle
      # blocker, so removing them flips no decision) but they must be OFF for the
      # oracle-free baseline. 99 disables the count blocker; false disables the
      # require-positive blocker. recent_distance_gains now only feeds logging.
      RESCUE_MAX_NON_POSITIVE_GAINS: 99
      RESCUE_REQUIRE_POSITIVE_RECENT_GAIN: false
      RESCUE_ALLOW_PHASE_VERIFY: true
      # Downgrade trajectory_incomplete from hard-reject to unknown when the agent
      # is already within this distance of the goal. Set 0.0 to disable.
      TRAJECTORY_BYPASS_DIST: 3.5
      # E3: near-distance visibility unreliability corrections (E3 pre-analysis
      # shows final_target_visible is only 11-45% accurate within 3m due to
      # occlusion and target filling the frame).
      # E3-B: arrival_evidence override — when dist < this and arrival_evidence=True
      # (or carry_forward from recent k steps), allow STOP despite not_visible.
      # Set 0.0 to disable. Raised to 3.0m to cover ep824's nearest-approach distance.
      E3_ARRIVAL_OVERRIDE_DIST: 3.0
      # E3-A/C: abstain zone — when dist < this and not_visible (no arrival_evidence),
      # demote hard-reject to abstain so agent continues approaching. Set 0.0 to disable.
      E3_ABSTAIN_DIST: 3.0
      # E5: distance guard on the visual-STOP rescue/override paths. Blocks a
      # rescue/override STOP when latest_goal_dist exceeds this (agent too far to
      # plausibly be at the target). Fixes far false stops (ep244 stopped at 6.2m).
      # Set 0.0 to disable. 4.0m aligns with ARRIVAL_GATE.DIST_THRESHOLD.
      RESCUE_MAX_GOAL_DIST: 4.0

    # U3: failure-conditioned recovery — reselects candidates after confirmed failure.
    # ENABLE_RESELECT required for decision effect.
    FAILURE_RECOVERY:
      ENABLED: True
      LOG_ONLY: false
      ENABLE_RESELECT: true
      MAX_RECOVERY_PER_EPISODE: 2
      NEGATIVE_GAIN_WINDOW: 2
