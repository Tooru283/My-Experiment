BASE_TASK_CONFIG_PATH: habitat_extensions/config/vlnce_task.yaml
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]
TRAINER_NAME: schedulesampler-OPENNAV  
GPU_NUMBERS: 1
NUM_ENVIRONMENTS: 1
CHECKPOINT_FOLDER: logs/checkpoints/
EVAL_CKPT_PATH_DIR: logs/checkpoints/
RESULTS_DIR: logs/eval_results/

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  EPISODE_COUNT: 100

MODEL:
  policy_name: PolicyViewSelectionCMA
  spatial_output: False
  RGB_ENCODER:
    encode_size: 2048
    output_size: 512
  DEPTH_ENCODER:
    encode_size: 128
    output_size: 256
    ddppo_checkpoint: data/pretrained_models/ddppo-models/gibson-2plus-resnet50.pth
  VISUAL_DIM:
    vis_hidden: 512
    directional: 64
  INSTRUCTION_ENCODER:
    bidirectional: True
    use_pretrained_embeddings: False
    embedding_size: 256
    hidden_size: 256

# -----------------------------------------------------------------------------
# Open-Nav Harness / V-series multimodal visual evidence switches
# -----------------------------------------------------------------------------
# Default here enables the full V-series with V2/V4 decision-effect:
#   - V1 extracts visual evidence from candidate images.
#   - V2 verifies STOP proposals with visual evidence and can reject unsupported
#     STOP when VISUAL_TARGET_VERIFIER.LOG_ONLY is false.
#   - V3 aggregates visual evidence into episode memory.
#   - V4 builds multimodal selector context and feeds it to selector when
#     MULTIMODAL_SELECTOR_CONTEXT.LOG_ONLY is false.
#
# Note: run_OpenNav.bash does not override OPENNAV_HARNESS by default, so this
# yaml is the single source of truth for V-series switches. Extra command-line
# overrides passed after the script command still take precedence.
OPENNAV_HARNESS:
  ENABLED: True
  ENABLE_HARNESS_LOGGING: True
  ENABLE_DECISION_EFFECT: True
  TRACE_DIR: logs/harness_traces/v2_v4_decision_effect
  TRACE_FORMAT: jsonl
  LOG_IMAGES: False
  FAIL_OPEN: True

  # V1: send candidate RGB views to local Qwen-VL service and log structured
  # visual evidence. Required by V3 and V4.
  VISUAL_EVIDENCE:
    ENABLED: True
    LOG_ONLY: True
    BASE_URL: http://127.0.0.1:23333/v1
    MODEL: /root/models/Qwen3.5-4B
    MAX_CANDIDATES: 5
    MAX_IMAGE_EDGE: 384
    MAX_TOKENS: 768
    TIMEOUT_SECONDS: 60.0
    IMAGE_JPEG_QUALITY: 70
    METADATA_OBSERVATION_CHARS: 300
    COMPACT_JSON: True

  # V2: visual verification for STOP proposals. With LOG_ONLY false and global
  # ENABLE_DECISION_EFFECT true, STOP is allowed only when verdict=allow. The
  # allow path uses STOP-only current-view evidence. Current-view text
  # corroboration is logged as a warning by default; turning it into a hard
  # blocker was too conservative for valid near-goal STOPs.
  VISUAL_TARGET_VERIFIER:
    ENABLED: True
    LOG_ONLY: false
    CONFIDENCE_THRESHOLD: 0.9
    REQUIRE_ARRIVAL_EVIDENCE: True
    REJECT_ON_MISSING_FINAL_LANDMARKS: True
    REJECT_ON_UNCERTAIN: True
    MIN_STEPS_BEFORE_ALLOW: 3
    REQUIRE_FULL_COVERAGE_FOR_ALLOW: True
    BLOCK_GENERIC_FINAL_TERMS_FOR_ALLOW: False
    REQUIRE_COMPLETION_FOR_SELECTOR_STOP: True
    REQUIRE_CURRENT_VIEW_TEXT_CORROBORATION_FOR_ALLOW: False

  # V3: aggregate V1 visual evidence across the current episode.
  VISUAL_EVIDENCE_MEMORY:
    ENABLED: True
    LOG_ONLY: true
    MAX_HISTORY: 64
    MAX_NOTES_CHARS: 240

  # V4: build compressed visual evidence context for selector candidates.
  # With LOG_ONLY false and global ENABLE_DECISION_EFFECT true, the augmented
  # context is fed into move_to_next_vp/test_decisions. Keep episode-level V3
  # memory out of the selector prompt by default; it remains logged for analysis.
  MULTIMODAL_SELECTOR_CONTEXT:
    ENABLED: True
    LOG_ONLY: false
    MAX_SUMMARY_CHARS: 180
    INCLUDE_MEMORY_SUFFIX: False

  # Low-risk runtime reduction: cap verbose text LLM outputs while keeping the
  # same decision flow and candidate set. Set a value <=0 to disable a cap.
  LLM_RUNTIME:
    COMPLETION_MAX_TOKENS: 512
    NAVIGATOR_MAX_TOKENS: 1024
    THOUGHT_FUSION_MAX_TOKENS: 256
    DECISION_MAX_TOKENS: 64

  # The previous 8/10 hard limit cut off many near-goal episodes. Keep the
  # evaluation bounded, but leave enough room for recovery after a wrong turn.
  NAVIGATION_RUNTIME:
    SHORT_ACTION_STEP_LIMIT: 10
    LONG_ACTION_STEP_LIMIT: 12
    SHORT_ACTION_COUNT_THRESHOLD: 6
    BLOCK_WEAK_FINAL_TARGET_COMPLETION_STOP: True
    MIN_STEPS_FOR_WEAK_FINAL_TARGET_COMPLETION_STOP: 8
